name: CI

# Checks only. There is deliberately no deploy job: production deployment
# requires a manual, approved step (docs/DEPLOYMENT.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation links and API inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

  check:
    name: Lint, typecheck, build, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          retention-days: 3
          path: |
            apps/api/dist
            apps/web/.next
            packages/shared/dist
          include-hidden-files: true

  postgres:
    name: Migrations and demo seed on PostgreSQL 16
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: manage
          POSTGRES_USER: manage
          POSTGRES_PASSWORD: ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manage" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DB_DRIVER: postgres
      DATABASE_URL: postgres://manage:ci-only@localhost:5432/manage
      SEED_DEMO_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared && pnpm --filter @manage/api build
      - run: pnpm db:migrate
      - run: pnpm db:seed-demo
      - name: Audit trail is append-only on real PostgreSQL
        run: |
          if PGPASSWORD=ci-only psql -h localhost -U manage -d manage -c "delete from audit_events" 2>&1 | grep -q "append-only"; then
            echo "trigger active"
          else
            echo "audit_events delete was not rejected" && exit 1
          fi
      - run: pnpm db:reset-demo
      - name: Daily report locks on real PostgreSQL (several connections)
        env:
          DAILY_PG_TEST_URL: postgres://manage:ci-only@localhost:5432/manage_daily
        run: |
          PGPASSWORD=ci-only psql -h localhost -U manage -d manage -c "create database manage_daily"
          cd apps/api && node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --testRegex 'test/daily-reports-postgres\.e2e-spec\.ts$'

  e2e:
    name: End-to-end (Playwright, Chromium)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    env:
      PW_CHANNEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @manage/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build and compose smoke test
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (synthetic preview data)
        run: |
          printf 'APP_ENV=preview\nPOSTGRES_PASSWORD=ci-only-db\nSEED_DEMO_PASSWORD=ci-only-demo\nWEB_PORT=3000\n' > .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Health through the web proxy and login
        run: |
          curl -fsS http://localhost:3000/api/v1/health | tee /dev/stderr | grep -q '"db":"ok"'
          curl -fsS -c jar -H 'content-type: application/json' -H 'x-manage-client: ci' \
            -d '{"username":"manager","password":"ci-only-demo"}' http://localhost:3000/api/v1/auth/login > /dev/null
          curl -fsS -b jar http://localhost:3000/api/v1/dashboard | grep -q '"activeCases":5'
      - if: always()
        run: docker compose logs --no-color api web | tail -100
      # Export tested images; publishing them to the VM remains a separate approved action.
      - name: Archive tested images for an approved Preview update
        run: |
          docker image inspect manage-api manage-web --format '{{.Id}}' > preview-image-ids.txt
          git rev-parse HEAD > preview-image-source.txt
          docker save manage-api manage-web | gzip > preview-images.tar.gz
          sha256sum preview-images.tar.gz > preview-images.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: preview-images-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            preview-images.tar.gz
            preview-images.sha256
            preview-image-ids.txt
            preview-image-source.txt
          compression-level: 0
          retention-days: 3
      - if: always()
        run: docker compose down -v
      # Same images behind the Preview overlay: Caddy with HTTPS (internal CA for
      # localhost), site password gate, web not published.
      - name: Preview overlay (Caddy, HTTPS, password gate)
        run: |
          printf 'APP_ENV=preview\nPOSTGRES_PASSWORD=ci-only-db\nSEED_DEMO_PASSWORD=ci-only-demo\nPREVIEW_HOST=localhost\n' > .env
          gate=$(openssl rand -hex 16)   # random per run; nothing to leak
          hash=$(docker run --rm caddy:2-alpine caddy hash-password --plaintext "$gate")
          printf 'basic_auth {\n\tpreview %s\n}\n' "$hash" > deploy/preview/auth.caddy
          docker run --rm -v "$PWD/deploy/preview:/cfg:ro" -e PREVIEW_HOST=localhost caddy:2-alpine \
            sh -c 'mkdir -p /etc/caddy && cp /cfg/auth.caddy /etc/caddy/auth.caddy && caddy validate --config /cfg/Caddyfile --adapter caddyfile'
          docker compose -f docker-compose.yml -f deploy/preview/docker-compose.preview.yml up -d --build --wait --wait-timeout 180
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login)" = 401
          curl -sk -u "preview:$gate" -D headers -o /dev/null https://localhost/login
          grep -qi '^x-robots-tag: noindex' headers
          curl -fsSk -u "preview:$gate" -c jar -H 'content-type: application/json' -H 'x-manage-client: ci' \
            -d '{"username":"manager","password":"ci-only-demo"}' https://localhost/api/v1/auth/login | grep -q '"username":"manager"'
          # Session cookie must carry the Secure flag (4th field of the cookie jar line).
          awk '!/^# / && NF >= 7 { print $4 }' jar | grep -qx TRUE
          curl -fsSk -u "preview:$gate" -b jar https://localhost/api/v1/dashboard | grep -q '"activeCases":5'
          ! curl -s -o /dev/null --max-time 3 http://localhost:3000/login
      - name: Deployment scripts
        run: |
          node --test deploy/preview/gate.test.mjs
          bash -n deploy/preview/setup-server.sh deploy/preview/deploy.sh deploy/preview/configure-smtp.sh
          shellcheck deploy/preview/setup-server.sh deploy/preview/deploy.sh deploy/preview/configure-smtp.sh
      - if: always()
        run: docker compose -f docker-compose.yml -f deploy/preview/docker-compose.preview.yml logs --no-color caddy api | tail -80
      - if: always()
        run: docker compose -f docker-compose.yml -f deploy/preview/docker-compose.preview.yml down -v

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Known vulnerabilities in production dependencies
        run: pnpm audit --prod --audit-level high
      # Requires Settings → Code security → Dependency graph (currently disabled; owner decision #4).
      # Non-blocking until enabled; pnpm audit above and gitleaks below still fail the job.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
