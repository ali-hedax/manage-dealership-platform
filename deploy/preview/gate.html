<!doctype html>
<html lang="fa" dir="rtl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود | Managed by HEDAX</title>
<link rel="stylesheet" href="/__preview/gate.css">
<main>
  <div class="brand" dir="ltr">Managed <span>by HEDAX</span></div>
  <p class="step">ورود به سامانه</p>
  <h1>Managed by HEDAX</h1>
  <p class="intro">برای ادامه، نام کاربری و رمز محافظ سایت را وارد کنید.</p>
  <form method="post" action="/__preview/login">
    <!-- error -->
    <label for="username">نام کاربری محافظ سایت</label>
    <input id="username" name="username" value="preview" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" dir="ltr" required maxlength="100">
    <label for="password">رمز محافظ سایت</label>
    <input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required maxlength="512" enterkeyhint="go" autofocus>
    <p class="help">از رمز <bdi>Site gate password</bdi> در فایل ورود استفاده کنید. اگر به این صفحه برگشتید، نام کاربری یا رمز را دوباره بررسی کنید.</p>
    <button type="submit">ادامه</button>
  </form>
  <p class="next">پس از این مرحله، با حساب خود مانند <bdi>manager</bdi> وارد Manage می‌شوید.</p>
</main>
</html>
